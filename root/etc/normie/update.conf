# Normie Linux Update & Repair settings (this file is read by the update script as root).
#
# DEPS_LIST_URL: an https:// address of a plain-text list of package names, one per line.
# The Update & Repair button installs anything on the list that is missing. It reads
# NAMES ONLY: it never downloads or runs code from this address. Leave empty to skip.
# Once the project is on GitHub, set it to the raw address of dist/normie-deps.list, e.g.
#   DEPS_LIST_URL="https://raw.githubusercontent.com/OWNER/REPO/main/dist/normie-deps.list"
DEPS_LIST_URL=""

# FIRMWARE: "yes" lets the button also install firmware updates (BIOS/UEFI, SSD, devices) through
# fwupd, only while plugged in. It is OFF by default because, unlike every other update, a
# firmware update cannot be undone by restoring a snapshot. Applied at the next restart.
FIRMWARE="no"

# REMIND_DAYS: show a gentle "time to update" notification when Update & Repair has not
# been run for this many days (checked once a day, shown at most every 3 days).
REMIND_DAYS=14
